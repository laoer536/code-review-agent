name: Release CLI

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Package CLI
        run: bun run build.ts --outfile=dist/code-review-agent

      - name: Create tarball
        run: tar -czf dist/code-review-agent-linux-x64.tar.gz -C dist code-review-agent

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/code-review-agent-linux-x64.tar.gz
